# Base de datos PostgreSQL para desarrollo local.
# Levantar:  docker compose up -d
# Frenar:    docker compose down   (los datos se conservan en el volumen)
services:
  db:
    image: postgres:16
    container_name: futbot-db
    environment:
      POSTGRES_USER: futbot
      POSTGRES_PASSWORD: futbot
      POSTGRES_DB: futbot
    ports:
      - "5432:5432"
    volumes:
      - futbot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futbot -d futbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  futbot-db-data:
    name: futbot-db-data
